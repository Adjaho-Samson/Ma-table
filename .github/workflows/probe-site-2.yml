name: probe-site-2
on:
  workflow_dispatch:
  push:
    branches:
      - arena/756ad948-ma-table
    paths:
      - '.github/workflows/probe-site-2.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/756ad948-ma-table
      - name: Probe assets + server action
        run: |
          set -x
          mkdir -p probe2/js
          BASE=https://ma-table-nine.vercel.app
          curl -sL "$BASE/table/827c0ff8-72e6-4a3f-ab05-a90dfbdd56e9" -o probe2/table3.html
          curl -sL "$BASE/robots.txt" -o probe2/robots.txt
          curl -sL "$BASE/manifest.webmanifest" -o probe2/manifest.webmanifest
          curl -sL "$BASE/og.png" -o probe2/og.png
          curl -sL "$BASE/icon.svg" -o probe2/icon.svg
          curl -sL "$BASE/apple-icon.png" -o probe2/apple-icon.png
          curl -sL "$BASE/_next/static/chunks/app/table/%5Bid%5D/page-9457936b210fbe3c.js" -o probe2/js/table-page.js
          file probe2/* | head -20
          TID=219b6ebf-7155-41f6-a6c7-96aaca2f93e3
          ACT=$(grep -oE '\$ACTION_ID_[a-f0-9]+' probe/table.html | head -1 | sed 's/\$ACTION_ID_//')
          echo "ACTION=$ACT"
          echo "--- invalid: empty whatsapp ---"
          curl -s -X POST "$BASE/table/$TID" -H 'Content-Type: multipart/form-data' \
            -F "\$ACTION_ID_$ACT=" -F "table_id=$TID" -F "prenom=Test" -F "whatsapp=" -F "profil=Etudiant" -F "website=" \
            -o probe2/post_invalid_whatsapp.html -w '%{http_code}\n'
          echo "--- invalid: no fields ---"
          curl -s -X POST "$BASE/table/$TID" -H 'Content-Type: multipart/form-data' \
            -F "\$ACTION_ID_$ACT=" -F "table_id=$TID" \
            -o probe2/post_empty.html -w '%{http_code}\n'
          echo "--- honeypot filled (should be blocked, no reservation) ---"
          curl -s -X POST "$BASE/table/$TID" -H 'Content-Type: multipart/form-data' \
            -F "\$ACTION_ID_$ACT=" -F "table_id=$TID" -F "prenom=BotTest" -F "whatsapp=0100000000" -F "profil=Etudiant" -F "website=http://spam.example" \
            -o probe2/post_honeypot.html -w '%{http_code}\n'
          for f in probe2/post_*.html; do echo "=== $f ==="; python3 - "$f" <<'PY'
          import sys,re,html
          s=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          m=re.search(r'<main.*?</main>', s, re.S)
          t=m.group(0) if m else s
          t=re.sub(r'<script.*?</script>','',t,flags=re.S)
          t=re.sub(r'<[^>]+>',' ',t)
          t=html.unescape(t)
          t=re.sub(r'\s+',' ',t)
          print(t[:2200])
          PY
          done
      - name: Commit
        run: |
          git config user.name probe
          git config user.email probe@example.com
          git add -f probe2
          git commit -m "chore: probe legacy assets and server action" || echo "nothing to commit"
          git push --force origin HEAD:probe-output-2
